<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-container">
      <header class="score-board">
        <div class="score-box">Score: <span id="current-score">0</span></div>
        <div class="score-box">
          Speed Level: <span id="speed-level">1</span>
        </div>
        <div class="score-box">High Score: <span id="high-score">0</span></div>
      </header>

      <div class="canvas-wrapper">
        <canvas id="game-canvas" width="600" height="600"></canvas>

        <div id="start-screen" class="overlay">
          <h1>SNAKE GAME</h1>
          <p class="controls-hint">
            Control the snake using the <strong>Arrow Keys</strong> on your
            keyboard. Walls are safe—you will wrap around them!
          </p>
          <button id="start-btn" class="menu-btn">Start Game</button>
        </div>

        <div id="pause-screen" class="overlay hidden">
          <h2>Game Paused</h2>
          <button id="continue-btn" class="menu-btn">Continue</button>
          <button id="restart-btn" class="menu-btn">New Game</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
          <h2>Game Over</h2>
          <p>Final Score: <span id="final-score">0</span></p>
          <button id="play-again-btn" class="menu-btn">Play Again</button>
        </div>
      </div>

      <footer class="controls-footer">
        <button id="pause-btn" class="action-btn" disabled>Pause Game</button>
      </footer>
    </main>
    <script src="script.js"></script>
  </body>
</html>
